<header class="h-16 bg-white border-b border-slate-200/80 sticky top-0 z-20 flex items-center justify-between px-4 sm:px-6 lg:px-8 shadow-[0_1px_3px_0_rgba(0,0,0,0.02)]">
  <div class="flex items-center space-x-3">
    <button id="sidebar-toggle" type="button" class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="flex items-center space-x-2">
      <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200/60">
        Phase 1 Active
      </span>
      <span class="text-xs text-slate-400 hidden sm:inline">•</span>
      <span class="text-xs text-slate-500 hidden sm:inline">Rental Management System</span>
    </div>
  </div>

  <div class="flex items-center space-x-4">
    {% if current_user.is_authenticated %}
      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <p class="text-xs font-bold text-slate-800 leading-tight">{{ current_user.username }}</p>
          <span class="inline-flex items-center text-[10px] text-emerald-600 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
            Online
          </span>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="btn-secondary !py-1.5 !px-3 !text-xs text-rose-600 hover:text-rose-700 hover:bg-rose-50 border-rose-200">
          Sign out
        </a>
      </div>
    {% else %}
      <div class="flex items-center space-x-2">
        <a href="{{ url_for('auth.login') }}" class="btn-secondary !py-1.5 !px-3 !text-xs">Log in</a>
        <a href="{{ url_for('auth.register') }}" class="btn-primary !py-1.5 !px-3 !text-xs">Register</a>
      </div>
    {% endif %}
  </div>
</header>
